<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8fa"><title>ami note｜編み物カウンター</title>
<style>
:root{--p:#e7adbd;--pd:#b86e87;--l:#c9c0e8;--ink:#594e58;--muted:#9c9099;--line:#f0e4e9}*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#fff7fa,#fffaf3 60%,#f7f5ff);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif}.app{max-width:500px;margin:auto;padding:env(safe-area-inset-top) 18px calc(25px + env(safe-area-inset-bottom));min-height:100vh}header{display:flex;justify-content:space-between;align-items:center;padding:20px 2px}.brand{display:flex;gap:10px;align-items:center}.mark{background:#ffeff4;border-radius:14px;padding:9px;font-size:20px}.brand b{font:22px Georgia}.sub{font-size:9px;letter-spacing:1.5px;color:var(--muted)}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}.icon{border:1px solid var(--line);background:#fff9;border-radius:13px;width:42px;height:42px;color:var(--pd);font-size:19px}.view{display:none}.view.active{display:block}.eyebrow{font-size:10px;letter-spacing:1.6px;color:var(--pd);font-weight:bold;margin:12px 2px 7px}h1{font-size:25px;margin:0 2px 6px}.lead{font-size:13px;color:var(--muted);margin:0 2px 20px}.add,.card,.counter,.stat{background:#ffffffdf;border:1px solid var(--line);border-radius:21px;box-shadow:0 7px 22px #86627610}.add{padding:16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.add strong{display:block;font-size:14px}.add small{color:var(--muted);font-size:11px}.primary{border:0;background:var(--p);color:white;font-weight:bold;border-radius:14px;padding:12px 15px}.list{display:grid;gap:10px}.card{width:100%;padding:15px;display:flex;align-items:center;gap:12px;text-align:left;color:inherit}.yarn{width:44px;height:44px;display:grid;place-items:center;border-radius:15px;background:#f2effb;font-size:22px}.info{flex:1;min-width:0}.info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}.meta{font-size:11px;color:var(--muted);margin-top:5px}.chev{font-size:22px;color:#c5b6c0}.empty{text-align:center;padding:35px;color:var(--muted);font-size:13px;line-height:1.8}.backline{display:flex;gap:10px;align-items:center;margin:5px 0 14px}.back{width:38px;height:38px;border:1px solid var(--line);background:#fff9;border-radius:13px;color:var(--pd);font-size:22px}.worktitle{font-weight:bold;font-size:18px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.counter{padding:20px 15px 16px;text-align:center}.label{font-size:11px;color:var(--muted);letter-spacing:1.5px}.rownum{font-size:clamp(58px,17vw,78px);font-weight:800;line-height:1.1;margin:8px 0 2px;font-variant-numeric:tabular-nums}.unit{font-size:12px;color:var(--muted)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.stat{padding:13px 6px}.stat span{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}.stat b{font-size:27px;font-variant-numeric:tabular-nums}.stat em{font-size:10px;color:var(--muted);font-style:normal}.section{font-size:12px;color:#927e89;font-weight:bold;margin:20px 2px 9px}.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.count{height:78px;border:1px solid #f0dfe6;background:white;border-radius:18px;color:var(--pd);font-size:25px;font-weight:bold}.count small{display:block;font-size:10px;color:#b69aa6;margin-top:3px}.count.pink{background:#fff0f4}.count.lav{background:#f3f0fb;color:#8374b4;border-color:#e5def6}.next{width:100%;height:56px;border:0;border-radius:17px;margin-top:11px;background:linear-gradient(100deg,#d99aad,#c5b8e5);color:white;font-weight:bold;font-size:15px}.tools{display:flex;gap:9px;margin-top:10px}.tool{flex:1;border:1px solid var(--line);background:#fff9;border-radius:13px;padding:11px;color:#8c7b85;font-size:12px}.tool:disabled{opacity:.35}.hint{text-align:center;color:var(--muted);font-size:11px;line-height:1.6;margin:12px 0}.footer{text-align:center;color:#b5a6af;font-size:10px;margin:25px 0}.shade{position:fixed;inset:0;background:#51434e66;display:none;align-items:flex-end;justify-content:center;padding:14px}.shade.show{display:flex}.modal{width:min(100%,460px);background:#fffafd;border-radius:23px;padding:22px}.modal h2{font-size:18px;margin:0 0 6px}.modal p{font-size:12px;color:var(--muted)}input{width:100%;padding:14px;border:1px solid var(--line);border-radius:13px;font:inherit}.actions{display:flex;gap:9px;margin-top:13px}.actions button{flex:1;padding:13px;border:1px solid var(--line);border-radius:13px;background:white}.actions .primary{border:0}.toast{position:fixed;bottom:25px;left:50%;transform:translate(-50%,15px);opacity:0;background:#655663;color:white;padding:10px 16px;border-radius:30px;font-size:12px;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@media(min-width:520px){.shade{align-items:center}}
</style></head><body><div class="app"><header><div class="brand"><div class="mark">🧶</div><div><b>ami note</b><div class="sub">KNITTING COUNTER</div></div></div><button class="icon" id="homeBtn">⌂</button></header>
<main><section class="view active" id="home"><div class="eyebrow">MY PROJECTS</div><h1>編みものノート</h1><p class="lead">作品ごとに、編み目と段数を記録しよう。</p><div class="add"><div><strong>新しい作品をはじめる</strong><small>作品ごとにカウンターを保存</small></div><button class="primary" id="add">＋ 追加</button></div><div class="list" id="list"></div></section>
<section class="view" id="counter"><div class="backline"><button class="back" id="back">‹</button><div class="worktitle" id="title"></div><button class="icon" id="rename">✎</button></div><div class="counter"><div class="label">CURRENT ROW</div><div class="rownum" id="row">0</div><div class="unit">段目</div><div class="stats"><div class="stat"><span>この段の編み目数</span><b id="stitches">0</b> <em>目</em></div><div class="stat"><span>作品全体の累計</span><b id="total">0</b> <em>目</em></div></div></div><div class="section">編み目をカウント</div><div class="counts"><button class="count" id="minus">−1<small>1目戻す</small></button><button class="count pink" id="plus">＋1<small>1目追加</small></button><button class="count lav" id="ten">＋10<small>10目追加</small></button></div><button class="next" id="next">次の段へ　→</button><div class="tools"><button class="tool" id="prev">↶ 前の段へ</button><button class="tool" id="reset">リセット</button></div><p class="hint" id="hint">鎖編み中は段数0のまま目数を数えます。</p></section></main><div class="footer">made with ♡ for your handmade time</div></div>
<div class="shade" id="shade"><div class="modal"><h2 id="modalTitle">作品を追加</h2><p id="desc">作品名を入力してください。</p><input id="name" maxlength="40" placeholder="例：ちいさなお花のポーチ"><div class="actions"><button id="cancel">キャンセル</button><button class="primary" id="save">保存する</button></div></div></div><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';const KEY='ami_note_projects_v1',el=id=>document.getElementById(id);let data=[],current=null,mode='add',timer;
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const make=name=>({id:id(),name,segments:[0],index:0,updated:Date.now()});
function normalize(p){if(!p||typeof p!=='object')return null;let s=Array.isArray(p.segments)?p.segments.map(x=>Math.max(0,Math.floor(Number(x)||0))):null;if(!s||!s.length){let r=Math.max(0,Math.floor(+p.row||0));s=Array(r+1).fill(0);s[r]=Math.max(0,Math.floor(+p.stitches||0));}return{id:String(p.id||id()),name:String(p.name||'名前のない作品'),segments:s,index:Math.min(s.length-1,Math.max(0,Math.floor(+p.index||0))),updated:+p.updated||Date.now()};}
function load(){try{let v=JSON.parse(localStorage.getItem(KEY)||'[]');data=Array.isArray(v)?v.map(normalize).filter(Boolean):[]}catch(e){data=[];toast('保存データを読み込めませんでした')}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){toast('端末に保存できませんでした')}}
function p(){return data.find(x=>x.id===current)}function sum(x){return x.segments.reduce((a,b)=>a+b,0)}function toast(s){let t=el('toast');t.textContent=s;t.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>t.classList.remove('show'),1700)}
function screen(which){el('home').classList.toggle('active',which==='home');el('counter').classList.toggle('active',which==='counter');el('homeBtn').style.visibility=which==='home'?'hidden':'visible'}
function home(){let box=el('list');box.replaceChildren();if(!data.length){box.innerHTML='<div class="empty">まだ作品がありません。<br>「＋ 追加」から最初の作品を登録してね ♡</div>';return} [...data].sort((a,b)=>b.updated-a.updated).forEach(x=>{let b=document.createElement('button');b.className='card';let y=document.createElement('div');y.className='yarn';y.textContent='🧶';let i=document.createElement('div');i.className='info';let n=document.createElement('b');n.textContent=x.name;let m=document.createElement('div');m.className='meta';m.textContent=`${x.index}段目 · 現在 ${x.segments[x.index]}目 · 累計 ${sum(x)}目`;i.append(n,m);let c=document.createElement('span');c.className='chev';c.textContent='›';b.append(y,i,c);b.onclick=()=>{current=x.id;render();screen('counter')};box.append(b)})}
function render(){let x=p();if(!x){screen('home');home();return}el('title').textContent=x.name;el('row').textContent=x.index;el('stitches').textContent=x.segments[x.index];el('total').textContent=sum(x);el('prev').disabled=x.index===0;el('hint').textContent=x.index===0?'鎖編み中は段数0のまま目数を数えます。':'前の段に戻っても、その段のカウントは保持されます。'}
function persist(){let x=p();if(x)x.updated=Date.now();save();render()}
function change(n){let x=p();if(!x)return;let v=x.segments[x.index];if(n<0&&v===0){toast('これ以上減らせません');return}x.segments[x.index]=Math.max(0,v+n);persist()}
function next(){let x=p();if(!x)return;if(x.index===x.segments.length-1)x.segments.push(0);x.index++;persist()}
function prev(){let x=p();if(!x||x.index===0)return;x.index--;persist()}
function reset(){let x=p();if(!x)return;if(!confirm('この作品のカウントをすべて0に戻しますか？\n作品名は残ります。'))return;x.segments=[0];x.index=0;persist();toast('リセットしました')}
function modal(m){mode=m;el('modalTitle').textContent=m==='add'?'新しい作品を追加':'作品名を変更';el('desc').textContent=m==='add'?'作品名をつけてカウンターを作成します。':'新しい作品名を入力してください。';el('name').value=m==='rename'?(p()?.name||''):'';el('shade').classList.add('show');setTimeout(()=>el('name').focus(),50)}
function close(){el('shade').classList.remove('show')}
function submit(){let name=el('name').value.trim();if(!name){toast('作品名を入力してください');return}if(mode==='add'){let x=make(name);data.push(x);current=x.id;save();close();render();screen('counter')}else{let x=p();if(x){x.name=name;persist();close()}}}
el('add').onclick=()=>modal('add');el('rename').onclick=()=>modal('rename');el('cancel').onclick=close;el('save').onclick=submit;el('name').onkeydown=e=>{if(e.key==='Enter')submit()};el('shade').onclick=e=>{if(e.target===el('shade'))close()};
el('minus').onclick=()=>change(-1);el('plus').onclick=()=>change(1);el('ten').onclick=()=>change(10);el('next').onclick=next;el('prev').onclick=prev;el('reset').onclick=reset;el('back').onclick=()=>{home();screen('home')};el('homeBtn').onclick=()=>{home();screen('home')};
load();home();screen('home');
})();
</script></body></html>
